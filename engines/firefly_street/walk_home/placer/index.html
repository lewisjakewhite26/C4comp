<title>Lamp Placer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: one column, phone first. Video stage on top, scrubber and transport under it, then lamp chips and correction tools. */
:root{
  --bg:#12161b; --panel:#1b2129; --panel2:#232a34; --line:#2e3744; --fg:#e9edf2; --muted:#93a0b0;
  --amber:#ffb454; --amber-ink:#2a1a00; --cyan:#5fd0e6; --danger:#ff6b5e; --ok:#6fd49a;
  --font:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'DM Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#f3f1ec; --panel:#ffffff; --panel2:#ebe8e1; --line:#d6d1c6; --fg:#1d2127; --muted:#667180;
  --amber:#c46a00; --amber-ink:#ffffff; --cyan:#007c93; --danger:#c43a2c; --ok:#1f8a52; color-scheme:light; } }
:root[data-theme="light"]{
  --bg:#f3f1ec; --panel:#ffffff; --panel2:#ebe8e1; --line:#d6d1c6; --fg:#1d2127; --muted:#667180;
  --amber:#c46a00; --amber-ink:#ffffff; --cyan:#007c93; --danger:#c43a2c; --ok:#1f8a52; color-scheme:light; }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.4;
  padding-block:10px 28px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));max-width:760px;margin-inline:auto}
h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.01em}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.tabs{display:flex;gap:6px}
.tab,.btn,.chip{font:inherit;color:var(--fg);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 12px;min-height:42px;cursor:pointer;touch-action:manipulation}
.tab[aria-pressed="true"]{background:var(--amber);color:var(--amber-ink);border-color:var(--amber);font-weight:700}
.btn:active,.chip:active{transform:translateY(1px)}
.btn.primary{background:var(--amber);color:var(--amber-ink);border-color:var(--amber);font-weight:700}
.btn.warn{color:var(--danger)}
.btn[disabled]{opacity:.4}
.stagewrap{position:relative;background:#000;border:1px solid var(--line);border-radius:10px;overflow:hidden;height:min(66vh,620px);touch-action:none}
canvas#stage{display:block;width:100%;height:100%;touch-action:none}
.hud{position:absolute;left:8px;top:8px;font-family:var(--mono);font-size:12px;background:rgba(0,0,0,.6);color:#fff;padding:3px 7px;border-radius:6px;pointer-events:none}
[hidden]{display:none!important}
.msg{pointer-events:none;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:#fff;background:rgba(0,0,0,.7);font-size:14px}
.scrub{position:relative;margin-top:10px}
.scrub input[type=range]{width:100%;height:34px;margin:0;accent-color:var(--amber)}
.marks{position:absolute;left:0;right:0;top:-4px;height:6px;pointer-events:none}
.mark{position:absolute;top:0;width:3px;height:10px;background:var(--cyan);border-radius:2px;transform:translateX(-1px)}
.mark.lit{background:var(--amber);height:14px;top:-2px}
.mark.end{background:var(--danger)}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.row .grow{flex:1 1 0;min-width:0}
.transport .btn{flex:1 1 0;padding-inline:4px;font-family:var(--mono);font-size:13px}
.label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:14px}
.chip{padding:8px 14px;font-weight:700;font-family:var(--mono)}
.chip[aria-pressed="true"]{background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}
.chip.off{opacity:.45}
.chip .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--cyan);margin-left:6px}
.info{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:14px}
.info b{font-family:var(--mono);font-weight:500}
.status{font-size:13px;color:var(--muted);margin-top:10px;font-family:var(--mono)}
.status.ok{color:var(--ok)} .status.bad{color:var(--danger)}
.how{font-size:14px;color:var(--muted);margin-top:8px}
label.sw{display:flex;gap:8px;align-items:center;min-height:42px}
input[type=range].zoom{flex:1 1 140px;accent-color:var(--amber)}
.kf{font-family:var(--mono);font-size:13px;padding:6px 10px;min-height:36px}
</style>

<div class="top">
  <h1>Lamp Placer</h1>
  <div class="tabs" id="tabs">
    <button class="tab" data-s="1" aria-pressed="true">Canal</button>
    <button class="tab" data-s="2" aria-pressed="false">Pier</button>
    <button class="tab" data-s="3" aria-pressed="false">Forest</button>
  </div>
</div>
<div class="how">Drag the box onto the lantern's glass. Pull the handles to resize. Scrub on, and fix it again wherever it drifts.</div>

<div class="stagewrap" id="wrap">
  <canvas id="stage"></canvas>
  <div class="hud" id="hud">f 0</div>
  <div class="msg" id="msg">Loading video&hellip;</div>
</div>

<div class="scrub">
  <div class="marks" id="marks"></div>
  <input type="range" id="seek" min="0" max="821" value="0" step="1" aria-label="Frame">
</div>

<div class="row transport">
  <button class="btn" id="b-24">&minus;1s</button>
  <button class="btn" id="b-1">&minus;1f</button>
  <button class="btn primary" id="play">Play</button>
  <button class="btn" id="b+1">+1f</button>
  <button class="btn" id="b+24">+1s</button>
</div>

<div class="label">Lantern</div>
<div class="row" id="chips"></div>

<div class="info" id="info"></div>

<div class="row">
  <button class="btn" id="jumplit">Go to when it lights</button>
  <button class="btn" id="fit">Fit lantern</button>
  <button class="btn" id="resetf">Undo fix here</button>
  <button class="btn warn" id="gone">Gone from here</button>
  <button class="btn" id="back">Still in frame</button>
</div>
<div class="row">
  <label class="sw"><input type="checkbox" id="glow" checked> Show glow</label>
  <label class="sw grow" style="flex:2 1 200px">Zoom <input class="zoom" type="range" id="zoom" min="1" max="8" step="0.1" value="1"></label>
</div>

<div class="label">Your fixes for this lantern</div>
<div class="row" id="kfs"></div>
<div class="status" id="status">Starting&hellip;</div>

<script>
(function(){
const FPS=24, VW=720, VH=1280;
const NAMES={1:'Canal',2:'Pier',3:'Forest'};
const $=id=>document.getElementById(id);
const stage=$('stage'), ctx=stage.getContext('2d'), wrap=$('wrap'), vid=document.createElement('video');
vid.muted=true; vid.playsInline=true; vid.preload='auto'; vid.setAttribute('playsinline','');
const st={scene:1,lamp:null,f:0,zoom:1,glow:true,playing:false,models:{},fixes:{1:{},2:{},3:{}},ready:false,dragging:null};
let db=null, saveTimer=null, dirty=new Set();

/* ---------- data helpers ---------- */
const fixOf=(s,k)=>{ const o=st.fixes[s]; return o[k]||(o[k]={kf:[],end:null}); };
function modelBox(k,f){ const m=st.models[st.scene]; if(!m) return null; const L=m.lamps[k]; if(!L) return null;
  const i=Math.min(L.box.length-1,Math.max(0,f-L.f0)); return L.box[i]; }
function delta(k,f){ const fx=st.fixes[st.scene][k]; if(!fx||!fx.kf.length) return [0,0,0,0];
  const kf=fx.kf; if(f<=kf[0].f) return kf[0].d.slice(); if(f>=kf[kf.length-1].f) return kf[kf.length-1].d.slice();
  for(let i=0;i<kf.length-1;i++){ const a=kf[i],b=kf[i+1]; if(f>=a.f&&f<=b.f){ const t=(f-a.f)/(b.f-a.f||1); return a.d.map((v,j)=>v+(b.d[j]-v)*t); } }
  return [0,0,0,0]; }
function boxAt(k,f){ const m=modelBox(k,f); if(!m) return null; const fx=st.fixes[st.scene][k];
  if(fx&&fx.end!=null&&f>fx.end) return null; const d=delta(k,f); return [m[0]+d[0],m[1]+d[1],m[2]+d[2],m[3]+d[3]]; }
const litAt=k=>{ const L=st.models[st.scene].lamps[k]; return L.lit==null?1e9:L.lit; };
const lampKeys=()=>Object.keys(st.models[st.scene].lamps);

/* ---------- view transform ---------- */
let cw=0,ch=0,dpr=1,sc=1,ox=0,oy=0;
function layout(){ const r=wrap.getBoundingClientRect(); dpr=Math.min(2,window.devicePixelRatio||1);
  cw=Math.max(200,r.width); ch=Math.max(200,r.height); stage.width=Math.round(cw*dpr); stage.height=Math.round(ch*dpr); draw(); }
function view(){ const fit=Math.min(cw/VW,ch/VH); const z=st.zoom; sc=fit*z;
  let cx=VW/2, cy=VH/2;
  if(z>1&&st.lamp){ const m=modelBox(st.lamp,st.f); if(m){ cx=(m[0]+m[2])/2; cy=(m[1]+m[3])/2; } }
  ox=cw/2-cx*sc; oy=ch/2-cy*sc;
  if(z<=1){ ox=(cw-VW*sc)/2; oy=(ch-VH*sc)/2; } }
const toS=(x,y)=>[x*sc+ox,y*sc+oy];
const toV=(x,y)=>[(x-ox)/sc,(y-oy)/sc];

/* ---------- drawing ---------- */
function glowPath(b,alpha){ const [x0,y0,x1,y1]=b, w=x1-x0, h=y1-y0; const a=toS(x0,y0), c=toS(x1,y1); const sw=c[0]-a[0], sh=c[1]-a[1];
  const g=ctx.createLinearGradient(0,a[1],0,c[1]); g.addColorStop(0,'rgba(255,170,70,0)'); g.addColorStop(.22,`rgba(255,175,80,${.85*alpha})`); g.addColorStop(.86,`rgba(255,160,60,${.8*alpha})`); g.addColorStop(1,'rgba(255,150,50,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(c[0],a[1]); ctx.lineTo(c[0]-sw*.175,c[1]); ctx.lineTo(a[0]+sw*.175,c[1]); ctx.closePath(); ctx.fill(); }
const HANDLES=[['tl',0,0],['t',.5,0],['tr',1,0],['r',1,.5],['br',1,1],['b',.5,1],['bl',0,1],['l',0,.5]];
function draw(){ if(!cw) return; ctx.setTransform(dpr,0,0,dpr,0,0); ctx.fillStyle='#000'; ctx.fillRect(0,0,cw,ch); view();
  if(vid.readyState>=2){ try{ ctx.drawImage(vid,ox,oy,VW*sc,VH*sc); }catch(e){} }
  if(!st.ready) return; const f=st.f;
  for(const k of lampKeys()){ const b=boxAt(k,f); if(!b) continue; const lit=f>=litAt(k), sel=k===st.lamp;
    if(st.glow&&lit) glowPath(b,sel?1:.9);
    const a=toS(b[0],b[1]), c=toS(b[2],b[3]);
    ctx.lineWidth=sel?2:1; ctx.setLineDash(lit?[]:[5,4]); ctx.strokeStyle=sel?'#ffb454':'rgba(95,208,230,.75)'; ctx.strokeRect(a[0],a[1],c[0]-a[0],c[1]-a[1]); ctx.setLineDash([]);
    ctx.fillStyle=sel?'#ffb454':'rgba(95,208,230,.9)'; ctx.font='600 12px "DM Mono",monospace'; ctx.fillText(k,a[0]+3,a[1]-4);
    if(sel){ ctx.fillStyle='#fff'; ctx.strokeStyle='#000'; ctx.lineWidth=1.5;
      for(const [n,fx,fy] of HANDLES){ const hx=a[0]+(c[0]-a[0])*fx, hy=a[1]+(c[1]-a[1])*fy; ctx.beginPath(); ctx.arc(hx,hy,7,0,6.283); ctx.fill(); ctx.stroke(); } } }
  $('hud').textContent=`${NAMES[st.scene]} \u00b7 ${(f/FPS).toFixed(2)}s \u00b7 f${f}`; }

/* ---------- video ---------- */
let seekPending=false;
function seekTo(f){ st.f=Math.max(0,Math.min(st.models[st.scene].N-1,Math.round(f))); $('seek').value=st.f;
  const t=(st.f+.5)/FPS; if(Math.abs(vid.currentTime-t)>0.001){ vid.currentTime=t; } draw(); refreshInfo(); }
vid.addEventListener('seeked',()=>{ draw(); });
vid.addEventListener('loadeddata',()=>{ $('msg').hidden=true; draw(); });
let triedBlob=false;
vid.addEventListener('error',async()=>{ if(!triedBlob){ triedBlob=true; try{ const r=await fetch(vid.dataset.src); const b=await r.blob(); vid.src=URL.createObjectURL(b); return; }catch(e){} }
  $('msg').hidden=false; $('msg').textContent='The video could not load. Reload the page.'; });
function loadScene(s){ st.scene=s; triedBlob=false; $('msg').hidden=false; $('msg').textContent='Loading video\u2026'; stopPlay();
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-pressed',String(+t.dataset.s===s)));
  const m=st.models[s]; $('seek').max=m.N-1; const ks=lampKeys(); st.lamp=ks.includes(st.lamp)?st.lamp:ks.find(k=>m.lamps[k].lit!=null&&m.lamps[k].lit>=0)||ks[0];
  vid.dataset.src='scene'+s+'.mp4'; vid.src='scene'+s+'.mp4'; vid.load(); st.f=0; $('seek').value=0;
  const first=Math.max(0,m.lamps[st.lamp].lit||0); buildChips(); buildMarks(); refreshInfo(); draw(); vid.addEventListener('loadeddata',function once(){ vid.removeEventListener('loadeddata',once); seekTo(first); fitLamp(); }); }
function fitLamp(){ const b=boxAt(st.lamp,st.f)||modelBox(st.lamp,st.f); if(!b) return; const fit=Math.min(cw/VW,ch/VH); const hh=Math.max(8,b[3]-b[1]);
  const z=Math.max(1,Math.min(8,(0.42*ch)/(hh*fit))); st.zoom=Math.round(z*10)/10; $('zoom').value=st.zoom; draw(); }
function stopPlay(){ st.playing=false; vid.pause(); $('play').textContent='Play'; }
function tick(){ if(!st.playing) return; const f=Math.floor(vid.currentTime*FPS); if(f!==st.f){ st.f=Math.min(f,st.models[st.scene].N-1); $('seek').value=st.f; refreshInfo(); } draw();
  if(vid.ended||st.f>=st.models[st.scene].N-1){ stopPlay(); return; } requestAnimationFrame(tick); }
$('play').onclick=()=>{ if(st.playing){ stopPlay(); return; } vid.playbackRate=.5; vid.play().then(()=>{ st.playing=true; $('play').textContent='Pause'; requestAnimationFrame(tick); }).catch(()=>{}); };

/* ---------- UI ---------- */
function buildChips(){ const box=$('chips'); box.innerHTML=''; for(const k of lampKeys()){ const b=document.createElement('button'); b.className='chip'; b.dataset.k=k; b.textContent=k;
  const fx=st.fixes[st.scene][k]; if(fx&&(fx.kf.length||fx.end!=null)){ const d=document.createElement('span'); d.className='dot'; b.appendChild(d); }
  b.onclick=()=>{ st.lamp=k; buildChips(); seekTo(Math.max(st.f,0)); buildMarks(); fitLamp(); refreshInfo(); draw(); }; b.setAttribute('aria-pressed',String(k===st.lamp)); if(!boxAt(k,st.f)) b.classList.add('off'); box.appendChild(b); } }
function buildMarks(){ const m=st.models[st.scene], box=$('marks'); box.innerHTML=''; if(!st.lamp) return; const fx=st.fixes[st.scene][st.lamp]; const N=m.N-1;
  const add=(f,cls)=>{ const e=document.createElement('div'); e.className='mark '+(cls||''); e.style.left=(f/N*100)+'%'; box.appendChild(e); };
  const L=m.lamps[st.lamp]; if(L.lit!=null&&L.lit>0) add(L.lit,'lit'); if(fx){ fx.kf.forEach(k=>add(k.f)); if(fx.end!=null) add(fx.end,'end'); } }
function refreshInfo(){ const m=st.models[st.scene]; if(!m||!st.lamp) return; const L=m.lamps[st.lamp], fx=fixOf(st.scene,st.lamp), f=st.f;
  const lit=L.lit==null?'never':(L.lit<=0?'from the start':(L.lit/FPS).toFixed(1)+'s');
  const b=boxAt(st.lamp,f); const state=!b?'out of frame':(f>=litAt(st.lamp)?'lit':'not lit yet');
  $('info').innerHTML=`Lantern <b>${st.lamp}</b> \u00b7 lights at <b>${lit}</b> \u00b7 now <b>${state}</b> \u00b7 fixes <b>${fx.kf.length}</b>${fx.end!=null?` \u00b7 gone from <b>${(fx.end/FPS).toFixed(1)}s</b>`:''}`;
  const kfs=$('kfs'); kfs.innerHTML=''; fx.kf.forEach(k=>{ const e=document.createElement('button'); e.className='btn kf'; e.textContent=(k.f/FPS).toFixed(1)+'s'; e.onclick=()=>seekTo(k.f); kfs.appendChild(e); });
  if(!fx.kf.length){ const s=document.createElement('span'); s.className='how'; s.textContent='None yet.'; kfs.appendChild(s); }
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('off',!boxAt(c.dataset.k,f))); }
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>loadScene(+t.dataset.s));
$('seek').oninput=e=>{ stopPlay(); seekTo(+e.target.value); };
$('b-24').onclick=()=>{stopPlay();seekTo(st.f-24)}; $('b-1').onclick=()=>{stopPlay();seekTo(st.f-1)};
$('b+1').onclick=()=>{stopPlay();seekTo(st.f+1)}; $('b+24').onclick=()=>{stopPlay();seekTo(st.f+24)};
$('glow').onchange=e=>{ st.glow=e.target.checked; draw(); };
$('zoom').oninput=e=>{ st.zoom=+e.target.value; draw(); };
$('fit').onclick=()=>fitLamp();
$('jumplit').onclick=()=>{ const L=st.models[st.scene].lamps[st.lamp]; stopPlay(); seekTo(Math.max(0,L.lit||0)); };
$('resetf').onclick=()=>{ const fx=fixOf(st.scene,st.lamp); const i=fx.kf.findIndex(k=>k.f===st.f); if(i>=0){ fx.kf.splice(i,1); changed(); } };
$('gone').onclick=()=>{ const fx=fixOf(st.scene,st.lamp); fx.end=st.f; changed(); };
$('back').onclick=()=>{ const fx=fixOf(st.scene,st.lamp); fx.end=null; changed(); };
function changed(){ dirty.add(st.scene); buildMarks(); buildChips(); refreshInfo(); draw(); scheduleSave(); }

/* ---------- pointer editing ---------- */
function hit(px,py){ const b=boxAt(st.lamp,st.f); if(!b) return null; const a=toS(b[0],b[1]), c=toS(b[2],b[3]);
  let best=null,bd=Math.max(9,Math.min(22,0.3*Math.min(c[0]-a[0],c[1]-a[1]))); for(const [n,fx,fy] of HANDLES){ const hx=a[0]+(c[0]-a[0])*fx, hy=a[1]+(c[1]-a[1])*fy; const d=Math.hypot(px-hx,py-hy); if(d<bd){ bd=d; best=n; } }
  if(best) return best; if(px>a[0]&&px<c[0]&&py>a[1]&&py<c[1]) return 'move'; return null; }
stage.addEventListener('pointerdown',e=>{ if(!st.ready) return; const r=stage.getBoundingClientRect(); const px=e.clientX-r.left, py=e.clientY-r.top; stopPlay();
  let h=hit(px,py);
  if(!h){ for(const k of lampKeys()){ const b=boxAt(k,st.f); if(!b) continue; const a=toS(b[0],b[1]), c=toS(b[2],b[3]); if(px>a[0]-8&&px<c[0]+8&&py>a[1]-8&&py<c[1]+8){ st.lamp=k; buildChips(); buildMarks(); refreshInfo(); draw(); return; } } return; }
  stage.setPointerCapture(e.pointerId); st.dragging={h,px,py,d0:delta(st.lamp,st.f),f:st.f}; e.preventDefault(); });
stage.addEventListener('pointermove',e=>{ const D=st.dragging; if(!D) return; const r=stage.getBoundingClientRect(); const dx=(e.clientX-r.left-D.px)/sc, dy=(e.clientY-r.top-D.py)/sc;
  const d=D.d0.slice(); const h=D.h;
  if(h==='move'){ d[0]+=dx; d[2]+=dx; d[1]+=dy; d[3]+=dy; }
  else{ if(h.includes('l')) d[0]+=dx; if(h.includes('r')) d[2]+=dx; if(h.includes('t')) d[1]+=dy; if(h.includes('b')) d[3]+=dy; }
  const m=modelBox(st.lamp,D.f); const w=m[2]+d[2]-(m[0]+d[0]), hh=m[3]+d[3]-(m[1]+d[1]); if(h!=='move'&&(w<3||hh<3)) return;
  const fx=fixOf(st.scene,st.lamp); let k=fx.kf.find(q=>q.f===D.f); if(!k){ k={f:D.f,d:d}; fx.kf.push(k); fx.kf.sort((a,b)=>a.f-b.f); } else k.d=d;
  changed(); });
const endDrag=()=>{ st.dragging=null; };
stage.addEventListener('pointerup',endDrag); stage.addEventListener('pointercancel',endDrag);

/* ---------- saving ---------- */
function setStatus(t,c){ const s=$('status'); s.textContent=t; s.className='status '+(c||''); }
function scheduleSave(){ setStatus('Saving\u2026'); clearTimeout(saveTimer); saveTimer=setTimeout(save,700); }
async function save(){ const scenes=[...dirty]; dirty.clear();
  try{ localStorage.setItem('lampfix',JSON.stringify(st.fixes)); }catch(e){}
  if(!db){ setStatus('Saved in this browser only. Claude cannot see it.','bad'); return; }
  try{ for(const s of scenes){ await db.doc('fix/scene'+s).set({lamps:st.fixes[s],scene:s,savedAt:Date.now()}); } setStatus('Saved. Claude can see your fixes.','ok'); }
  catch(e){ scenes.forEach(s=>dirty.add(s)); setStatus('Could not save to the shared store ('+(e&&e.code||'error')+'). Kept in this browser.','bad'); } }

/* ---------- start ---------- */
async function init(){
  for(const s of [1,2,3]){ try{ st.models[s]=await (await fetch('model'+s+'.json')).json(); }catch(e){ $('msg').textContent='Could not load the lamp data.'; return; } }
  try{ const c=await claude.use('db'); db=c||null; }catch(e){ db=null; }
  let loaded=false;
  if(db){ try{ for(const s of [1,2,3]){ const d=await db.doc('fix/scene'+s).get(); if(d.exists){ const v=d.data(); if(v&&v.lamps){ st.fixes[s]=v.lamps; loaded=true; } } } }catch(e){} }
  if(!loaded){ try{ const j=JSON.parse(localStorage.getItem('lampfix')||'null'); if(j){ st.fixes=j; } }catch(e){} }
  st.ready=true; setStatus(db?'Ready. Your fixes save as you go.':'Ready. Saving in this browser only.',db?'ok':'bad'); loadScene(1); }

new ResizeObserver(layout).observe(wrap); window.addEventListener('resize',layout); layout(); init();
